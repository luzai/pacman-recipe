[project]
name = "pacman-recipe"
version = "0.1.0"
description = "Pacman reinforcement-learning recipes and headless environment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest", "pygame>=2.5", "omegaconf>=2.3"]
agent = ["openai"]
dataset = ["datasets"]
pygame = ["pygame>=2.5"]
h100-offload = [
  "torch-memory-saver==0.0.9.post1; platform_system == 'Linux'",
]

[tool.setuptools.packages.find]
include = ["pacman_recipe*", "pacman_env*", "slime_pacman*", "areal_pacman*", "maapacman*"]

[tool.setuptools.package-data]
"pacman_recipe.synthetic" = ["maze_suites/*.json"]
"pacman_env.env" = ["*.md", "levels/*.txt", "levels/*.json", "levels/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
