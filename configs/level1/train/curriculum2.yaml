recipe_version: maapacman-level1-ghostdoor-v3
artifact_root: artifacts/runs/generated/curriculum2-step512-40seed-v1
trajectory_dir: ${artifact_root}/trajectories
experiment_name: pacman-agentic-rl
trial_name: curriculum2-qwen3p5-base-three-lives-step512-50update

environment:
  ghost_mode: normal
  max_steps: 512
  episode_life_mode: original_three_lives
dataset_generation:
  train_episodes: 40
  validation_episodes: 4
  seed: 28

planner_audit:
  max_steps: 512

# Training RNG; dataset_generation.seed separately fixes rows 28-71.
seed: 1
# Curriculum 2: cold-start directly from the Qwen3.5-9B base model with a fresh
# optimizer/scheduler lineage. recover.mode handles interruption recovery only
# inside this run.
# - moving ghosts; 40 train rows / batch size 4 = 10 updates per epoch
# - 5 epochs = 50 total updates
# - both train and validation dataset rows use 512 environment steps
# - validate once before training and after each completed epoch
# - training samples at temperature=0.7, top_p=1.0
# - explicit +1 normal-pellet, +1 power-pellet, and +50 completion rewards
# - fixed 0.05 penalty per executed environment step
# - BFS nearest-pellet guidance scaled smoothly by normal-pellet clear ratio
# - screenshot plus live engine state and bounded navigation history
# - the model emits one advertised C*/A*/E* option code (not JSON or a
#   movement action); Edward executes it with bounded replanning
# - save every update so a 2-update smoke has a real checkpoint
# - TMS alternates the colocated actor and reference model: actor is offloaded
#   during rollout/ref log-prob, then reference is offloaded before actor update
enable_offload: true
enable_thinking: false
validation_contract: sampled12_uniform_shaped
reward_objective_contract: episode_return_group_v1
image_prompt_style: live_state_v3
prompt_version: edward-option-code-v2
action_protocol: edward-option-code-v1
total_train_epochs: 5
total_train_steps: null
tokenizer_path: ${actor.path}
workflow: pacman_recipe.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
contract_violation_return: -1.0
use_base_reward: false
normal_pellet_reward: 1.0
power_pellet_reward: 1.0
ghost_reward: 5.0
fruit_reward: 0.0
reward_recipe_version: maapacman-level1-event-reward-v3
death_penalty: 100.0
completion_reward: 50.0
safety_refusal_penalty: 100.0
step_penalty: 0.05
step_penalty_cleared_ratio_scale: 0.0
wall_penalty: 0.5
nearest_pellet_alpha: 0.1
nearest_pellet_remaining_ratio_threshold: 1.0
nearest_pellet_scale_by_cleared_ratio: true
nearest_pellet_skip_on_eat: true
observation_mode: rgb
action_token_choice: false
open_action_mask: false
edward_options: true
objective_encoding: edward-option-code-v1
completion_api: chat
critic: null
teacher: null

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}

gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

eval_gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  offload: true
  fsdp:
    # Keep phase-level offload, but disable FSDP CPU parameter offload.
    offload_params: false
    # Preserve the GPU-initialized vision RoPE parity path.
    memory_efficient_load: false
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: bfloat16
  mb_spec:
    # The Edward option-code trajectory can exceed 512 tokens. Keep enough
    # headroom for those sequences and NCCL's grad-norm all-reduce.
    max_tokens_per_mb: 1024
  optimizer:
    type: adam_bf16
    lr: 5.0e-7
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  # AReaL normalizes the 12 episode returns before applying this bound.
  reward_clip: 20.0
  kl_ctl: 0.01
  kl_logprob_source: proximal
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  prox_logp_method: recompute
  rejection_sampling:
    level: sequence
    action: mask
    metric: ratio
    agg: sum
    lower: 0.8
    upper: 1.25
  # Normalize exactly 12 complete-episode returns from the same initial maze
  # state, then broadcast that episode advantage to all of its option decisions.
  reward_norm:
    mean_level: group
    mean_leave1out: false
    std_level: group
    std_unbiased: true
    eps: 1.0e-5
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  temperature: ${actor.temperature}
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer: null
  offload: true
  fsdp:
    offload_params: false
    memory_efficient_load: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  # Requires the matching AReaL actor/FSDP and vLLM vision fixes; restart to apply.
  # Full-batch language log-prob parity remains under validation.
  worker_extension_cls: areal.engine.vllm_ext.qwen35_torch_vision_worker.Qwen35TorchVisionWorkerExtension
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.65
  enforce_eager: true
  gdn_prefill_backend: triton
  logprobs_mode: processed_logprobs

train_dataset:
  batch_size: 4
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: artifacts/datasets/curriculum2-step512-40seed-v1/train_hf
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 4
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: artifacts/datasets/curriculum2-step512-40seed-v1/validation_hf
  type: rl
  max_length: 1024

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  # Bound disk usage while preserving the two newest regular checkpoints.
  # Also save and preserve every newly observed global-best training reward;
  # the separate recover_checkpoint is never pruned by this policy.
  keep_last: 2
  keep_best_metric: ppo_actor/task_reward/avg
  keep_best_mode: max
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

recover:
  # Fresh stage: initialize weights only, without recovering C1 optimizer state.
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null
  eval_before_train: true

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  swanlab:
    mode: offline
    project: maapacman-level1
    name: ${trial_name}
