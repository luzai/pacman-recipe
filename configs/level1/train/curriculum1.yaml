recipe_version: maapacman-level1-ghostdoor-v3
artifact_root: artifacts/runs/generated/curriculum1-step512-v1
trajectory_dir: ${artifact_root}/trajectories
experiment_name: pacman-agentic-rl
trial_name: curriculum1-qwen3p5-9b-step512-100update-direct

environment:
  ghost_mode: disabled
  max_steps: 512
  episode_life_mode: single_death
dataset_generation:
  train_episodes: 80
  validation_episodes: 4
  seed: 28

planner_audit:
  max_steps: 512

# Training RNG; dataset_generation.seed separately fixes rows 28-111.
seed: 1
# Curriculum 1: the complete run initialized from Qwen3.5-9B.
# - 80 train rows / batch size 4 = 20 updates per epoch
# - 5 epochs = 100 total updates
# - use --smoke-updates 2 to cap this same recipe at exactly 2 updates
# - no ghosts; both splits use 512 environment steps (not model calls)
# - no in-training validation; keep validation rows for separate evaluation
# - training samples at temperature=0.7, top_p=1.0
# - explicit +1 normal-pellet, +1 power-pellet, and +50 completion rewards
# - fixed 0.05 penalty per executed environment step
# - BFS nearest-pellet guidance scaled smoothly by normal-pellet clear ratio
# - screenshot plus live engine state and bounded navigation history
# - the model directly emits exactly one currently open U/D/L/R token;
#   Curriculum 1 neither initializes nor calls Edward
# - save every update so a 2-update smoke has a real checkpoint
# - TMS alternates the colocated actor and reference model: actor is offloaded
#   during rollout/ref log-prob, then reference is offloaded before actor update
enable_offload: true
enable_thinking: false
validation_contract: sampled12_uniform_shaped
reward_objective_contract: step_local_raw_v1
image_prompt_style: live_state_v3
prompt_version: live-state-direct-action-v4+fixed-image-dynamic-v2
action_protocol: direct-open-action-token-v1
total_train_epochs: 5
# Null means the complete 100-update run. The release CLI sets this field only
# when --smoke-updates is explicitly supplied.
total_train_steps: null
tokenizer_path: ${actor.path}
workflow: pacman_recipe.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
contract_violation_return: -1.0
use_base_reward: false
normal_pellet_reward: 1.0
power_pellet_reward: 1.0
ghost_reward: 5.0
fruit_reward: 0.0
reward_recipe_version: maapacman-level1-event-reward-v3
death_penalty: 100.0
completion_reward: 50.0
safety_refusal_penalty: 100.0
step_penalty: 0.05
step_penalty_cleared_ratio_scale: 0.0
wall_penalty: 0.5
nearest_pellet_alpha: 0.1
nearest_pellet_remaining_ratio_threshold: 1.0
nearest_pellet_scale_by_cleared_ratio: true
nearest_pellet_skip_on_eat: true
observation_mode: rgb
action_token_choice: true
open_action_mask: true
edward_options: false
objective_encoding: direct-action-token-v1
completion_api: chat
critic: null
teacher: null

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}

gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

eval_gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  offload: true
  fsdp:
    # Keep phase-level offload, but disable FSDP CPU parameter offload.
    offload_params: false
    # Preserve the GPU-initialized vision RoPE parity path.
    memory_efficient_load: false
  # C1 GC OFF accepted on the matching 8x H800 smoke; C2 is gated separately.
  gradient_checkpointing: false
  dtype: bfloat16
  optimizer_dtype: bfloat16
  mb_spec:
    # Keep enough headroom for the live-state image prompt and NCCL's
    # grad-norm all-reduce.
    max_tokens_per_mb: 1024
  optimizer:
    type: adam_bf16
    lr: 5.0e-7
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  # Preserve finite event-reward magnitudes (for example +50 completion)
  # before KL is added. NaN/Inf task rewards remain invalid.
  reward_clip: .inf
  kl_ctl: 0.01
  kl_logprob_source: proximal
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  prox_logp_method: recompute
  rejection_sampling:
    level: sequence
    action: mask
    metric: ratio
    agg: sum
    lower: 0.8
    upper: 1.25
  # Each direction decision receives only its own shaped environment-step
  # reward. Do not normalize or broadcast a whole-episode return.
  reward_norm: null
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  temperature: ${actor.temperature}
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer: null
  offload: true
  fsdp:
    offload_params: false
    memory_efficient_load: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  # Requires the matching AReaL actor/FSDP and vLLM vision fixes; restart to apply.
  # Full-batch language log-prob parity remains under validation.
  worker_extension_cls: areal.engine.vllm_ext.qwen35_torch_vision_worker.Qwen35TorchVisionWorkerExtension
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.65
  enforce_eager: true
  gdn_prefill_backend: triton
  logprobs_mode: processed_logprobs

train_dataset:
  batch_size: 4
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: artifacts/datasets/curriculum1-step512-v1/train_hf
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 4
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: artifacts/datasets/curriculum1-step512-v1/validation_hf
  type: rl
  max_length: 1024

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  # Bound disk usage while preserving the two newest regular checkpoints.
  # Also save and preserve every newly observed global-best training reward;
  # the separate recover_checkpoint is never pruned by this policy.
  keep_last: 2
  keep_best_metric: ppo_actor/task_reward/avg
  keep_best_mode: max
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

recover:
  # Fresh run: do not load prior training state. Enable auto only for recovery.
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
  eval_before_train: false

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  swanlab:
    mode: offline
    project: maapacman-level1
    name: ${trial_name}
