recipe_version: maapacman-level1-ghostdoor-v3
# /home is full on both H100 hosts; runs and trajectories must land on /docker.
artifact_root: /docker/h100-repro/runs/curriculum2-risk-fallback-open-v1
trajectory_dir: ${artifact_root}/trajectories
experiment_name: pacman-agentic-rl
trial_name: curriculum2-qwen3p5-base-risk-fallback-open

environment:
  ghost_mode: normal
  max_steps: 512
  episode_life_mode: single_death
dataset_generation:
  # Seeds 72-111 are the designated holdout and must stay unseen: training
  # therefore starts above it rather than at 28. Seeds 28-71 belong to the
  # previous run's train/validation split and are also left alone.
  #   train      112-311
  #   validation 312-331
  #   holdout     72-111  (never generated here)
  seed: 112
  train_episodes: 200
  validation_seed_start: 312
  validation_episodes: 20

planner_audit:
  max_steps: 512

# Training RNG; dataset_generation.seed separately fixes rows 112-331.
seed: 1
# Curriculum 2 with the Edward single-step risk fallback, run open-ended.
#
# Why this differs from curriculum2_single_death.yaml:
# - edward_fallback_mode=risk_ranked. Under the default `refuse` mode the
#   planner raises EdwardSafetyRefusal whenever no candidate clears the ghost
#   safety gate, which ended 65-79% of measured episodes without ever asking
#   the model. Those are harness decisions the policy cannot learn from. In
#   risk_ranked mode the physically open directions are advertised with risk
#   annotations instead, so the same states become model decisions. Refusal
#   then only remains for a cell with no open neighbour, which a connected
#   maze does not produce.
# - 200 train rows instead of 40, so a run stopped early has seen five times
#   as many distinct mazes before repeating any of them.
# - 20 validation rows instead of 4. At n=4 the validation win rate swung
#   43.8% -> 14.6% -> 35.4% across consecutive epochs, which cannot support
#   checkpoint selection.
# - total_train_epochs=100 is a cap that will not be reached; the run is meant
#   to be stopped by hand once validation looks good. lr_scheduler_type is
#   constant with no warmup, so nothing about the schedule depends on it.
# - evaluator runs every 5 updates rather than every epoch: one epoch is now
#   50 updates, which would leave the run unobservable for ~10 hours.
# - saver keeps 20 checkpoints at every 5th update. keep_last=2 previously
#   pruned the epoch-2/3 checkpoints of the last run and made its
#   generalization curve unrecoverable.
#
# Unchanged from the release recipe: 512 environment steps, 8 GPUs split
# 4 rollout / 4 actor, batch size 4, 12 samples per group, lr 5e-7, KL 0.01,
# one token per decision, binary win/lose reward via --reward-ablation.
enable_offload: true
enable_thinking: false
validation_contract: sampled12_uniform_shaped
reward_objective_contract: episode_return_group_v1
image_prompt_style: live_state_v3
prompt_version: edward-option-code-v2+fixed-image-dynamic-v2
action_protocol: edward-option-code-v1
total_train_epochs: 100
total_train_steps: null
tokenizer_path: ${actor.path}
workflow: pacman_recipe.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
contract_violation_return: -1.0
use_base_reward: false
normal_pellet_reward: 0.0
power_pellet_reward: 0.0
ghost_reward: 0.0
fruit_reward: 0.0
reward_recipe_version: maapacman-level1-event-reward-v3
death_penalty: 0.0
completion_reward: 1.0
safety_refusal_penalty: 0.0
step_penalty: 0.0
step_penalty_cleared_ratio_scale: 0.0
wall_penalty: 0.0
nearest_pellet_alpha: 0.0
nearest_pellet_remaining_ratio_threshold: 1.0
nearest_pellet_scale_by_cleared_ratio: false
nearest_pellet_skip_on_eat: true
observation_mode: rgb
action_token_choice: false
open_action_mask: false
edward_options: true
edward_fallback_mode: risk_ranked
objective_encoding: edward-option-code-v1
completion_api: chat
critic: null
teacher: null

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}

gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

eval_gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  offload: true
  fsdp:
    # Keep phase-level offload, but disable FSDP CPU parameter offload.
    offload_params: false
    # Preserve the GPU-initialized vision RoPE parity path.
    memory_efficient_load: false
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: bfloat16
  mb_spec:
    # The Edward option-code trajectory can exceed 512 tokens. Keep enough
    # headroom for those sequences and NCCL's grad-norm all-reduce.
    max_tokens_per_mb: 1024
  optimizer:
    type: adam_bf16
    lr: 5.0e-7
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  # AReaL normalizes the 12 episode returns before applying this bound.
  reward_clip: 20.0
  kl_ctl: 0.01
  kl_logprob_source: proximal
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  prox_logp_method: recompute
  rejection_sampling:
    level: sequence
    action: mask
    metric: ratio
    agg: sum
    lower: 0.8
    upper: 1.25
  # Normalize exactly 12 complete-episode returns from the same initial maze
  # state, then broadcast that episode advantage to all of its option decisions.
  reward_norm:
    mean_level: group
    mean_leave1out: false
    std_level: group
    std_unbiased: true
    eps: 1.0e-5
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  temperature: ${actor.temperature}
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer: null
  offload: true
  fsdp:
    offload_params: false
    memory_efficient_load: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  # Requires the matching AReaL actor/FSDP and vLLM vision fixes; restart to apply.
  # Full-batch language log-prob parity remains under validation.
  worker_extension_cls: areal.engine.vllm_ext.qwen35_torch_vision_worker.Qwen35TorchVisionWorkerExtension
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.65
  enforce_eager: true
  gdn_prefill_backend: triton
  logprobs_mode: processed_logprobs

train_dataset:
  batch_size: 4
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: /docker/h100-repro/datasets/curriculum2-risk-fallback-step512-200seed-v1/train_hf
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 4
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: /docker/h100-repro/datasets/curriculum2-risk-fallback-step512-200seed-v1/validation_hf
  type: rl
  max_length: 1024

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  # A hand-stopped run must still have the checkpoint it was stopped for.
  # keep_last=2 pruned the last run's epoch-2/3 checkpoints and destroyed its
  # generalization curve. 20 checkpoints at every 5th update covers the last
  # 100 updates at roughly 18 GB each, which /docker has room for.
  keep_last: 20
  keep_best_metric: ppo_actor/task_reward/avg
  keep_best_mode: max
  freq_epochs: null
  freq_steps: 5
  freq_secs: null

recover:
  # Fresh stage: initialize weights only, without recovering C1 optimizer state.
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  # One epoch is 50 updates here, so per-epoch validation would leave the run
  # unobservable for about ten hours at a time.
  freq_epochs: null
  freq_steps: 5
  freq_secs: null
  eval_before_train: true

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  swanlab:
    mode: offline
    project: maapacman-level1
    name: ${trial_name}
