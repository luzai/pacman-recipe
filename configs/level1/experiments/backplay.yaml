# Experimental primitive-action Backplay; launch with train_backplay.py.
recipe_version: maapacman-adaptive-backplay-v1
artifact_root: artifacts/backplay/pilot
trajectory_dir: ${artifact_root}/trajectories
experiment_name: pacman-agentic-rl
trial_name: backplay-primitive-pilot
environment:
  ghost_mode: normal
  max_steps: 512
  episode_life_mode: original_three_lives
dataset_generation:
  train_episodes: 4
  validation_episodes: 4
  seed: 0
planner_audit:
  max_steps: 512
seed: 1
enable_offload: true
enable_thinking: false
validation_contract: sampled12_uniform_shaped
reward_objective_contract: episode_return_group_v1
image_prompt_style: live_state_v3
prompt_version: live-state-direct-action-v3
action_protocol: direct-open-action-token-v1
total_train_epochs: 10
total_train_steps: 10
tokenizer_path: ${actor.path}
workflow: areal_pacman.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
contract_violation_return: -1.0
use_base_reward: false
normal_pellet_reward: 1.0
power_pellet_reward: 1.0
ghost_reward: 5.0
fruit_reward: 0.0
reward_recipe_version: maapacman-level1-event-reward-v3
death_penalty: 100.0
completion_reward: 50.0
safety_refusal_penalty: 100.0
step_penalty: 0.05
step_penalty_cleared_ratio_scale: 0.0
wall_penalty: 0.5
nearest_pellet_alpha: 0.1
nearest_pellet_remaining_ratio_threshold: 1.0
nearest_pellet_scale_by_cleared_ratio: true
nearest_pellet_skip_on_eat: true
observation_mode: rgb
action_token_choice: true
open_action_mask: true
edward_options: false
objective_encoding: direct-action-token-v1
completion_api: chat
critic: null
teacher: null
cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve
scheduler:
  type: local
rollout:
  backend: vllm:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0
eval_gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0
actor:
  backend: fsdp:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  offload: true
  fsdp:
    offload_params: false
    memory_efficient_load: false
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer:
    type: adam_bf16
    lr: 5.0e-07
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  reward_clip: 20.0
  kl_ctl: 0.01
  kl_logprob_source: proximal
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  prox_logp_method: recompute
  rejection_sampling:
    level: sequence
    action: mask
    metric: ratio
    agg: sum
    lower: 0.8
    upper: 1.25
  reward_norm:
    mean_level: group
    mean_leave1out: false
    std_level: group
    std_unbiased: true
    eps: 1.0e-05
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars:
      NCCL_DEBUG: WARN
ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  temperature: ${actor.temperature}
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer: null
  offload: true
  fsdp:
    offload_params: false
    memory_efficient_load: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}
vllm:
  worker_extension_cls: areal.engine.vllm_ext.qwen35_torch_vision_worker.Qwen35TorchVisionWorkerExtension
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.65
  enforce_eager: true
  gdn_prefill_backend: triton
  logprobs_mode: processed_logprobs
train_dataset:
  batch_size: 4
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: backplay-runner-generated
  type: rl
  max_length: 1024
valid_dataset:
  batch_size: 4
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: backplay-runner-generated
  type: rl
  max_length: 1024
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  keep_last: 2
  keep_best_metric: ppo_actor/task_reward/avg
  keep_best_mode: max
  freq_epochs: null
  freq_steps: 1
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null
  eval_before_train: false
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  swanlab:
    mode: offline
    project: maapacman-level1
    name: ${trial_name}
backplay_experiment: true
dynamic_bs: false
